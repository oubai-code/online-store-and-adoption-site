<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pawHavenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E3BC9" />
      <stop offset="50%" stop-color="#7B33BA" />
      <stop offset="100%" stop-color="#5E1F99" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8DA1" />
      <stop offset="100%" stop-color="#FF6584" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A1061" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle with Gradient -->
  <circle cx="256" cy="256" r="236" fill="url(#pawHavenGrad)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFD8EC" stroke-width="6" stroke-opacity="0.45" />

  <!-- Heart Base Shape in Center with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Central Paw Main Pad (Heart-Infused) -->
    <path d="M256,365 C220,365 192,338 192,302 C192,274 214,254 238,242 C246,238 256,230 256,230 C256,230 266,238 274,242 C298,254 320,274 320,302 C320,338 292,365 256,365 Z" fill="#FFFFFF" />

    <!-- Left Lower Toe Pad -->
    <ellipse cx="170" cy="235" rx="34" ry="46" transform="rotate(-26 170 235)" fill="#FFFFFF" />

    <!-- Left Center Toe Pad -->
    <ellipse cx="220" cy="172" rx="32" ry="46" transform="rotate(-9 220 172)" fill="#FFFFFF" />

    <!-- Right Center Toe Pad -->
    <ellipse cx="292" cy="172" rx="32" ry="46" transform="rotate(9 292 172)" fill="#FFFFFF" />

    <!-- Right Lower Toe Pad -->
    <ellipse cx="342" cy="235" rx="34" ry="46" transform="rotate(26 342 235)" fill="#FFFFFF" />

    <!-- Heart Accent inside Main Pad -->
    <path d="M256,338 C256,338 230,314 230,296 C230,282 241,273 252,276 C256,277 256,281 256,281 C256,281 256,277 260,276 C271,273 282,282 282,296 C282,314 256,338 256,338 Z" fill="url(#heartGrad)" />
  </g>
</svg>
